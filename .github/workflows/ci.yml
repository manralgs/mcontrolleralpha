name: mController CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile application
        run: python -m py_compile app.py enhancements.py deployment.py update_watchdog.py

      - name: Run security regression tests
        env:
          MCONTROLLER_TESTING: "1"
        run: python -m unittest discover -s tests -v

      - name: Check repository for accidental runtime files
        shell: bash
        run: |
          forbidden=0
          for path in mcontroller.db .env runtime archives; do
            if [ -e "$path" ]; then
              echo "Forbidden runtime path present: $path"
              forbidden=1
            fi
          done
          test "$forbidden" -eq 0

      - name: Package complete application
        if: matrix.python-version == '3.12'
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          root = Path(".").resolve()
          output = root / f"mcontrolleralpha-{os.environ['RELEASE_SHA'][:12]}.zip"
          excluded = {".git", ".venv", "__pycache__", "runtime", "archives", "mcontroller.db", ".env", output.name}

          with ZipFile(output, "w", ZIP_DEFLATED) as archive:
              for path in root.rglob("*"):
                  if not path.is_file():
                      continue
                  rel = path.relative_to(root)
                  if any(part in excluded for part in rel.parts):
                      continue
                  archive.write(path, rel.as_posix())

          print(output)
          PY

      - name: Upload complete application ZIP
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: mcontrolleralpha-${{ github.sha }}
          path: mcontrolleralpha-${{ github.sha }}.zip
          if-no-files-found: error
          retention-days: 30
